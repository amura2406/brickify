[project]
name = "lego-mosaic-maker"
version = "1.0.0"
description = "Turn any photo into a buildable LEGO Art mosaic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",
    "firebase-admin>=6.5.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "reportlab>=4.4.10",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
